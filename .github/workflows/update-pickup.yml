name: Update FGO pickup

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-fgo-pickup
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check official FGO pickup news
        run: python scripts/update_pickup.py

      - name: Commit only when pickup changed
        shell: bash
        run: |
          if git diff --quiet -- pickup.json; then
            echo "No new pickup. Nothing to commit."
            exit 0
          fi

          git config user.name "YURA Chaldea Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pickup.json
          git commit -m "Auto-update latest FGO pickup"
          git push
